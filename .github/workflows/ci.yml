name: CI Pipeline

on:
    push:
        branches: ["main"]

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                python-versions: '3.9'

            - name: Install Dependencies
              run: |
               pip install -r requirements.txt

            - name: Run PyTest
              run: pytest